[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paylens-benchmark"
version = "0.1.0"
description = "Comparative Benchmark and Audit: Exasol vs ClickHouse for FinTech Analytics"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "clickhouse-connect>=0.7.0",
    "pyexasol>=0.26.0",
    "kafka-python-ng>=2.2.2",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
